name: ClipForge APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/android/sdk
      ANDROID_SDK_ROOT: /usr/local/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest uploaded Alpha-3 source archive
        id: source
        run: |
          set -euo pipefail
          latest_file=""
          latest_commit=0
          while IFS= read -r file; do
            commit_time="$(git log -1 --format=%ct -- "$file")"
            if [ "$commit_time" -gt "$latest_commit" ]; then
              latest_commit="$commit_time"
              latest_file="$file"
            fi
          done < <(find . -maxdepth 1 -type f -name 'ClipForgeAndroid-alpha-3-*.zip' -print)

          if [ -z "$latest_file" ]; then
            echo "ERROR: No Alpha-3 source ZIP found in repository root."
            ls -lah
            exit 1
          fi
          echo "Selected archive: $latest_file"
          ls -lh "$latest_file"
          sha256sum "$latest_file"
          echo "archive=$latest_file" >> "$GITHUB_OUTPUT"

      - name: Extract selected source archive
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "${{ steps.source.outputs.archive }}" -d extracted
          PROJECT_DIR="$(find extracted -type f -name 'settings.gradle*' -printf '%h\n' | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found in the archive."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle"

      - name: Verify selected source and version
        run: |
          set -euo pipefail
          GRADLE_FILE="$project_dir/app/build.gradle.kts"
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE="$project_dir/app/build.gradle"
          echo "Building project: $project_dir"
          grep -E 'versionCode|versionName' "$GRADLE_FILE" || true
          find "$project_dir/app/src/main" -type f | head -40

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run backend tests
        run: |
          BACKEND_DIR="$(find "$project_dir" -maxdepth 3 -type d -name backend | head -1)"
          if [ -n "$BACKEND_DIR" ]; then
            (cd "$BACKEND_DIR" && PYTHONPATH=. pytest -q)
          else
            echo "Backend directory not found; skipping backend tests."
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Media3 dependency versions
        working-directory: ${{ env.project_dir }}
        run: |
          gradle --no-daemon :app:dependencies --configuration debugCompileClasspath > media3-dependencies.txt
          grep -i "androidx.media3" media3-dependencies.txt || true

      - name: Build debug APK
        working-directory: ${{ env.project_dir }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK generated
        run: |
          set -euo pipefail
          APK="$project_dir/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK generated successfully:"
          ls -lh "$APK"
          sha256sum "$APK"
          GRADLE_FILE="$project_dir/app/build.gradle.kts"
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE="$project_dir/app/build.gradle"
          grep -E 'versionCode|versionName' "$GRADLE_FILE" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-debug-apk
          path: ${{ env.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-build-diagnostics
          path: |
            media3-dependencies.txt
            ${{ env.project_dir }}/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
