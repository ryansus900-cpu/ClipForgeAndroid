name: ClipForge APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify corrected source archive
        run: |
          set -e

          ARCHIVE="ClipForgeAndroid-alpha-3-fixed-source.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Corrected source archive not found!"
            echo "Expected: $ARCHIVE"
            echo "Files available:"
            ls -lah
            exit 1
          fi

          echo "Using corrected archive:"
          ls -lh "$ARCHIVE"
          sha256sum "$ARCHIVE"

      - name: Extract corrected project
        run: |
          set -e

          mkdir -p extracted
          unzip -q ClipForgeAndroid-alpha-3-fixed-source.zip -d extracted

          echo "Extracted project files:"
          ls -lah extracted/ClipForgeAndroid

          test -f extracted/ClipForgeAndroid/app/build.gradle.kts
          test -f extracted/ClipForgeAndroid/app/src/main/java/com/clipforge/app/MainActivity.kt

      - name: Verify source fixes
        working-directory: extracted/ClipForgeAndroid
        run: |
          set -e

          SUBTITLE_FILE="app/src/main/java/com/clipforge/app/ui_SubtitleStudio.kt"
          GRADLE_FILE="app/build.gradle.kts"

          echo "Checking verticalScroll import..."
          grep -Fq "import androidx.compose.foundation.verticalScroll" "$SUBTITLE_FILE"

          echo "Checking Media3 dependency version..."
          grep -Fq 'media3-effect:1.9.3' "$GRADLE_FILE"

          echo "Checking corrected caption JSON return..."
          grep -Fq 'return JSONObject().put("words", JSONArray(words)).toString()' "$SUBTITLE_FILE"

          echo "Source verification passed."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run backend tests
        working-directory: extracted/ClipForgeAndroid/backend
        run: |
          PYTHONPATH=. pytest -q

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Media3 dependency versions
        working-directory: extracted/ClipForgeAndroid
        run: |
          gradle --no-daemon :app:dependencies \
            --configuration debugCompileClasspath \
            > media3-dependencies.txt

          grep -i "androidx.media3" media3-dependencies.txt || true

      - name: Build debug APK
        working-directory: extracted/ClipForgeAndroid
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: |
          APK="extracted/ClipForgeAndroid/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-debug-apk
          path: extracted/ClipForgeAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-build-diagnostics
          path: |
            media3-dependencies.txt
            extracted/ClipForgeAndroid/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
